services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berkah-mandiri-inventory
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      # Persistent storage untuk file upload/ekspor dokumen
      - app_storage:/var/www/html/storage/app
    networks:
      - ai_network

volumes:
  app_storage:
    driver: local

networks:
  ai_network:
    external: true
