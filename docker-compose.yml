services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berkah-mandiri-inventory
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:80"

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDER: ${RUN_SEEDER:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-stock_management}
      DB_USERNAME: ${DB_USERNAME:-berkah_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    volumes:
      - app_storage:/var/www/html/storage/app

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - ai-network

  mysql:
    image: mysql:8.0
    container_name: berkah-mandiri-mysql
    restart: unless-stopped

    env_file:
      - .env.mysql

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stock_management}
      MYSQL_USER: ${DB_USERNAME:-berkah_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ai-network

volumes:
  app_storage:
    driver: local
  mysql_data:
    driver: local

networks:
  ai-network:
    external: true
    name: ${DOCKER_NETWORK:-ai-network}