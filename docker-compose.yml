services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berkah-mandiri-inventory
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:80"

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDER: ${RUN_SEEDER:-true}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-stock_management}
      DB_USERNAME: ${DB_USERNAME:-berkah_user}
      DB_PASSWORD: ${DB_PASSWORD}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - app_storage:/var/www/html/storage/app

    networks:
      - ai-network

volumes:
  app_storage:
    driver: local

networks:
  ai-network:
    external: true
    name: ${DOCKER_NETWORK:-ai-network}
